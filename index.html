<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Auto Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .chat-card {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 650px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .chat-header {
      padding: 14px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-weight: 700;
      color: #58a6ff;
      font-size: 1rem;
    }
    .status {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 12px;
      background: #30363d;
      color: #8b949e;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      max-width: 80%;
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-wrap: break-word;
      background: #21262d;
      border: 1px solid #30363d;
    }
    .bubble .user-name {
      display: block;
      font-size: 0.75rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 3px;
    }
    .bubble .msg-time {
      display: block;
      font-size: 0.65rem;
      color: #8b949e;
      text-align: right;
      margin-top: 4px;
    }
    .chat-form {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 12px;
      background: #0d1117;
      border-top: 1px solid #30363d;
    }
    .form-row {
      display: flex;
      gap: 8px;
    }
    input {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 6px;
      padding: 10px 12px;
      color: #f0f6fc;
      outline: none;
      font-size: 0.9rem;
    }
    input:focus {
      border-color: #58a6ff;
    }
    #userInput {
      width: 35%;
    }
    #msgInput {
      flex: 1;
    }
    button {
      background: #238636;
      color: #ffffff;
      border: none;
      border-radius: 6px;
      padding: 10px 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover {
      background: #2ea043;
    }
    button:disabled {
      background: #23863666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <span class="title">Repo Chat (cshadrielpersonal-ai/Chat)</span>
      <span class="status" id="status">Connecting...</span>
    </div>

    <div class="chat-box" id="messageBox"></div>

    <form class="chat-form" id="chatForm">
      <div class="form-row">
        <input type="text" id="userInput" placeholder="Name" required autocomplete="off">
        <input type="text" id="msgInput" placeholder="Write a message..." required autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </div>

  <script>
    // GitHub API Configurations
    const GITHUB_USERNAME = 'cshadrielpersonal-ai';
    const GITHUB_REPO = 'Chat';
    const FILE_PATH = 'messages.json';
    const GITHUB_PAT = 'Ghp_so4MQemLxhqknLXcy2s04ZUNgTRQJR1pHOuQ';

    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`;

    const messageBox = document.getElementById('messageBox');
    const form = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const msgInput = document.getElementById('msgInput');
    const statusText = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    let currentSha = null;
    let localMessages = [];

    // Helper functions for base64 encoding with UTF-8 support
    const toBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const fromBase64 = str => decodeURIComponent(escape(atob(str)));

    // Fetch messages directly from the repository
    async function fetchMessages() {
      try {
        const res = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${GITHUB_PAT}`,
            'Accept': 'application/vnd.github+json'
          }
        });

        if (res.status === 404) {
          statusText.textContent = "Online (New Room)";
          localMessages = [];
          currentSha = null;
          return;
        }

        const data = await res.json();
        currentSha = data.sha;
        const decoded = fromBase64(data.content.replace(/\n/g, ''));
        localMessages = JSON.parse(decoded);
        renderMessages();
        statusText.textContent = "Synced";
      } catch (err) {
        statusText.textContent = "Sync Error";
        console.error(err);
      }
    }

    function renderMessages() {
      messageBox.innerHTML = '';
      localMessages.forEach(msg => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = `
          <span class="user-name">${escapeHTML(msg.user)}</span>
          <span class="msg-text">${escapeHTML(msg.text)}</span>
          <span class="msg-time">${msg.time}</span>
        `;
        messageBox.appendChild(bubble);
      });
      messageBox.scrollTop = messageBox.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    // Push new chat entry directly as a commit to GitHub
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = userInput.value.trim();
      const text = msgInput.value.trim();
      if (!user || !text) return;

      sendBtn.disabled = true;
      statusText.textContent = "Committing to repo...";

      const newEntry = {
        user: user,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      localMessages.push(newEntry);
      renderMessages();
      msgInput.value = '';

      try {
        const payload = {
          message: `Add message from ${user} [auto-sync]`,
          content: toBase64(JSON.stringify(localMessages, null, 2)),
          sha: currentSha || undefined
        };

        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${GITHUB_PAT}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.content && result.content.sha) {
          currentSha = result.content.sha;
          statusText.textContent = "Saved & Committed!";
        } else {
          statusText.textContent = "Commit error";
        }
      } catch (err) {
        statusText.textContent = "Network error";
        console.error(err);
      } finally {
        sendBtn.disabled = false;
      }
    });

    // Start background sync loop
    fetchMessages();
    setInterval(fetchMessages, 4000);
  </script>
</body>
</html>
