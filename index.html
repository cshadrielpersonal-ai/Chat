<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat - Auto Sync</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 12px;
    }
    .chat-card {
      width: 100%;
      max-width: 480px;
      height: 90vh;
      max-height: 650px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
    }
    .chat-header {
      padding: 12px 16px;
      background: #21262d;
      border-bottom: 1px solid #30363d;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .title {
      font-weight: 700;
      color: #58a6ff;
      font-size: 0.95rem;
    }
    .status {
      font-size: 0.75rem;
      padding: 3px 8px;
      border-radius: 12px;
      background: #30363d;
      color: #8b949e;
    }
    .chat-box {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .bubble {
      position: relative;
      max-width: 80%;
      padding: 8px 24px 8px 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      line-height: 1.4;
      word-wrap: break-word;
      background: #21262d;
      border: 1px solid #30363d;
    }
    .bubble .user-name {
      display: block;
      font-size: 0.75rem;
      color: #58a6ff;
      font-weight: bold;
      margin-bottom: 2px;
    }
    .bubble .msg-time {
      display: block;
      font-size: 0.65rem;
      color: #8b949e;
      text-align: right;
      margin-top: 3px;
    }
    /* Tiny Delete Button */
    .del-btn {
      position: absolute;
      top: 4px;
      right: 6px;
      background: transparent;
      border: none;
      color: #6e7681;
      font-size: 0.85rem;
      cursor: pointer;
      line-height: 1;
      padding: 2px 4px;
      border-radius: 4px;
    }
    .del-btn:hover {
      color: #f85149;
      background: rgba(248, 81, 73, 0.1);
    }
    /* Uniform Input Bar */
    .chat-form {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 10px;
      background: #0d1117;
      border-top: 1px solid #30363d;
    }
    .chat-form input,
    .chat-form button {
      height: 38px;
      border-radius: 6px;
      font-size: 0.88rem;
    }
    input {
      background: #161b22;
      border: 1px solid #30363d;
      padding: 0 10px;
      color: #f0f6fc;
      outline: none;
      transition: all 0.2s ease-in-out;
    }
    input:focus {
      border-color: #58a6ff;
    }
    /* Balanced widths */
    #userInput {
      width: 75px;
      min-width: 75px;
      text-overflow: ellipsis;
    }
    #userInput:focus {
      width: 120px;
      box-shadow: 0 0 6px rgba(88, 166, 255, 0.3);
    }
    #msgInput {
      flex: 1;
      min-width: 0;
    }
    /* Compact Send Button */
    #sendBtn {
      background: #238636;
      color: #ffffff;
      border: none;
      padding: 0 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }
    #sendBtn:hover {
      background: #2ea043;
    }
    #sendBtn:disabled {
      background: #23863666;
      cursor: not-allowed;
    }
  </style>
</head>
<body>

  <div class="chat-card">
    <div class="chat-header">
      <span class="title">Repo Chat</span>
      <span class="status" id="status">Connecting...</span>
    </div>

    <div class="chat-box" id="messageBox"></div>

    <form class="chat-form" id="chatForm">
      <input type="text" id="userInput" placeholder="Name" title="Click to edit name" required autocomplete="off">
      <input type="text" id="msgInput" placeholder="Message..." required autocomplete="off">
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    const GITHUB_USERNAME = 'cshadrielpersonal-ai';
    const GITHUB_REPO = 'Chat';
    const FILE_PATH = 'messages.json';
    const GITHUB_PAT = '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';

    const API_URL = `https://api.github.com/repos/${GITHUB_USERNAME}/${GITHUB_REPO}/contents/${FILE_PATH}`;

    const messageBox = document.getElementById('messageBox');
    const form = document.getElementById('chatForm');
    const userInput = document.getElementById('userInput');
    const msgInput = document.getElementById('msgInput');
    const statusText = document.getElementById('status');
    const sendBtn = document.getElementById('sendBtn');

    let currentSha = null;
    let localMessages = [];
    let isSaving = false;

    const savedName = localStorage.getItem('chat_username');
    if (savedName) {
      userInput.value = savedName;
    }

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') {
        e.preventDefault();
        if (userInput.value.trim()) {
          localStorage.setItem('chat_username', userInput.value.trim());
          msgInput.focus();
        }
      }
    });

    const toBase64 = str => btoa(unescape(encodeURIComponent(str)));
    const fromBase64 = str => decodeURIComponent(escape(atob(str)));

    async function fetchMessages() {
      if (isSaving) return;
      try {
        const res = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${GITHUB_PAT}`,
            'Accept': 'application/vnd.github+json'
          }
        });

        if (res.status === 404) {
          statusText.textContent = "Online (Ready)";
          localMessages = [];
          currentSha = null;
          return;
        }

        const data = await res.json();
        currentSha = data.sha;
        const decoded = fromBase64(data.content.replace(/\n/g, ''));
        localMessages = JSON.parse(decoded);
        renderMessages();
        statusText.textContent = "Synced";
      } catch (err) {
        statusText.textContent = "Sync Error";
        console.error(err);
      }
    }

    function renderMessages() {
      messageBox.innerHTML = '';
      localMessages.forEach((msg, idx) => {
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerHTML = `
          <button class="del-btn" title="Delete message" onclick="deleteMessage(${idx})">&times;</button>
          <span class="user-name">${escapeHTML(msg.user)}</span>
          <span class="msg-text">${escapeHTML(msg.text)}</span>
          <span class="msg-time">${msg.time}</span>
        `;
        messageBox.appendChild(bubble);
      });
      messageBox.scrollTop = messageBox.scrollHeight;
    }

    function escapeHTML(str) {
      return str.replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    async function commitMessages(commitTitle) {
      isSaving = true;
      statusText.textContent = "Committing...";

      try {
        const checkRes = await fetch(API_URL, {
          headers: {
            'Authorization': `Bearer ${GITHUB_PAT}`,
            'Accept': 'application/vnd.github+json'
          }
        });
        if (checkRes.ok) {
          const checkData = await checkRes.json();
          currentSha = checkData.sha;
        }

        const payload = {
          message: commitTitle,
          content: toBase64(JSON.stringify(localMessages, null, 2)),
          sha: currentSha || undefined
        };

        const res = await fetch(API_URL, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${GITHUB_PAT}`,
            'Accept': 'application/vnd.github+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        const result = await res.json();
        if (result.content && result.content.sha) {
          currentSha = result.content.sha;
          statusText.textContent = "Saved & Committed!";
        } else {
          statusText.textContent = `Error: ${result.message || 'Check Token'}`;
        }
      } catch (err) {
        statusText.textContent = "Network Error";
        console.error(err);
      } finally {
        isSaving = false;
        sendBtn.disabled = false;
      }
    }

    async function deleteMessage(index) {
      if (confirm("Delete this message?")) {
        localMessages.splice(index, 1);
        renderMessages();
        await commitMessages("Delete message [auto-sync]");
      }
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const user = userInput.value.trim();
      const text = msgInput.value.trim();
      if (!user || !text) return;

      localStorage.setItem('chat_username', user);
      sendBtn.disabled = true;

      const newEntry = {
        user: user,
        text: text,
        time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
      };

      localMessages.push(newEntry);
      renderMessages();
      msgInput.value = '';

      await commitMessages(`Chat: ${user}`);
    });

    fetchMessages();
    setInterval(fetchMessages, 4000);
  </script>
</body>
</html>
